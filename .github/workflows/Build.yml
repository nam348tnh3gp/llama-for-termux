name: Build llama.cpp for Android (Termux)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tên tag (để trống sẽ tự sinh theo timestamp)'
        required: false
        type: string
      release_name:
        description: 'Tên hiển thị của release (để trống sẽ dùng tag_name)'
        required: false
        type: string
      make_latest:
        description: 'Đánh dấu là bản release mới nhất?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout own repo (for tagging)
        uses: actions/checkout@v4
        with:
          path: self-repo
          fetch-depth: 0

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/llama.cpp'
          ref: 'master'
          submodules: 'recursive'
          fetch-depth: 1
          path: llama.cpp

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llama-android-master
          max-size: 2G

      - name: Configure CMake
        working-directory: llama.cpp
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_LTO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        working-directory: llama.cpp
        run: cmake --build build-android --config Release -j$(nproc)

      - name: Prepare Termux package
        run: |
          PKG=llama-termux
          ROOT=$PKG/data/data/com.termux/files/usr
          mkdir -p $ROOT/bin $ROOT/lib

          for b in llama-cli llama-server llama-bench; do
            [ -f llama.cpp/build-android/bin/$b ] && cp llama.cpp/build-android/bin/$b $ROOT/bin/
          done
          find llama.cpp/build-android -name '*.so' -exec cp {} $ROOT/lib/ \; 2>/dev/null || true

          cat > $ROOT/bin/llama-check-ram <<'EOF'
          #!/data/data/com.termux/files/usr/bin/bash
          MIN_MB=${1:-2048}
          AVAIL_MB=$(( $(awk '/MemAvailable/ {print $2}' /proc/meminfo) / 1024 ))
          if [ "$AVAIL_MB" -lt "$MIN_MB" ]; then
              echo "[CẢNH BÁO] RAM trống: ${AVAIL_MB}MB < ${MIN_MB}MB."
              exit 1
          fi
          echo "[OK] RAM trống: ${AVAIL_MB}MB."
          EOF
          chmod +x $ROOT/bin/llama-check-ram

          mkdir -p $PKG/DEBIAN
          cat > $PKG/DEBIAN/control <<EOF
          Package: llama-termux
          Version: 0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}
          Architecture: aarch64
          Maintainer: nam348tnh3gp
          Section: utils
          Priority: optional
          Description: llama.cpp binaries for Termux (arm64-v8a, KleidiAI)
          EOF

          dpkg-deb --build $PKG llama-termux.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-termux-deb
          path: llama-termux.deb
          retention-days: 7

      - name: Resolve tag & release name
        id: meta
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="build-$(date -u +%Y%m%d-%H%M%S)-r${GITHUB_RUN_NUMBER}"
          fi
          NAME="${{ inputs.release_name }}"
          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi
          echo "tag=$TAG"   >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Create tag
        working-directory: self-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "${{ steps.meta.outputs.tag }}" | grep -q .; then
            echo "::error::Tag '${{ steps.meta.outputs.tag }}' đã tồn tại. Chọn tên khác."
            exit 1
          fi
          git tag "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Build thủ công từ llama.cpp master.
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}
            - Yêu cầu: RAM trống ≥ 2GB, Termux arm64.
          files: llama-termux.deb
          make_latest: ${{ inputs.make_latest == 'true' }}